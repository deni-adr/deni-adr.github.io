name: TikTok - Post video now
on:
  workflow_dispatch:
    inputs:
      video: {description: "Video URL or repo path (e.g. videos/clip.mp4)", required: true}
      caption: {description: "Caption", required: false, default: ""}
      privacy: {description: "INBOX (draft to TikTok inbox) / SELF_ONLY / FOLLOWER_OF_CREATOR / MUTUAL_FOLLOW_FRIENDS", required: false, default: "INBOX"}
      account: {description: "Account label (main = uyunks_HnR; e.g. akun2)", required: false, default: "main"}
concurrency: uyunks
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIKTOK_CLIENT_KEY: sbawe2jipfn5lpa5io
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
      ACCOUNT: ${{ inputs.account }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data; set -o pipefail
          python3 scripts/tiktok.py post "${{ inputs.video }}" "${{ inputs.caption }}" "${{ inputs.privacy }}" 2>&1 | tee >(grep -v '::add-mask::' > data/last_post.log)
      - name: Save changes
        if: always()
        run: |
          git config user.name "uyunks-bot"; git config user.email "uyunks-bot@users.noreply.github.com"
          git add -A data queue 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Uyunks: update state" && git push)
