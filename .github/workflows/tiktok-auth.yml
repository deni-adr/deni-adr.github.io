name: TikTok - Connect account
on:
  workflow_dispatch:
    inputs:
      code: {description: "Authorization code from the site", required: true}
      account: {description: "Account label (main = uyunks_HnR; e.g. akun2)", required: false, default: "main"}
concurrency: uyunks
jobs:
  auth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIKTOK_CLIENT_KEY: sbawe2jipfn5lpa5io
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
      ACCOUNT: ${{ inputs.account }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "::add-mask::${{ inputs.code }}"; mkdir -p data; set -o pipefail
          python3 scripts/tiktok.py auth "${{ inputs.code }}" 2>&1 | tee >(grep -v '::add-mask::' > data/last_auth.log)
      - name: Save changes
        if: always()
        run: |
          git config user.name "uyunks-bot"; git config user.email "uyunks-bot@users.noreply.github.com"
          git add -A data queue 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Uyunks: update state" && git push)
